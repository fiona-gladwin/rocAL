syntax = "proto2";

package rocal_proto;

// Stores the Input/Ouptut tensors
message InputOutput {
  required string name = 1;
  optional string type = 2;
  required bool is_argument_input = 3 [default = false];
  required int32 device = 4;
  optional int32 dtype = 5;
  optional int32 layout = 6;
  optional int32 color_format = 7;
  repeated uint64 dims = 8;
  optional uint32 num_dims = 9;
}

// Stores a single argument
message Arguments {
  required string name = 1;
  optional string type = 2;
  optional string instance_name = 3;
  repeated float floats = 4;
  repeated int64 ints = 5;
  repeated string strings = 6;
  repeated bool bools = 7;
  repeated uint64 uints = 8;

  // vector storage
  required bool is_vector = 9 [default = false];
}

// Stores info about each operator in pipeline
message OperatorDef {
  required string name = 1;
  optional string module_name = 2;
  // Arguments
  repeated Arguments args = 3;
  // Inputs
  repeated InputOutput inputs = 4;
  repeated InputOutput outputs = 5;
}

// Stores pipeline arguments and a list of nodes/operators
message PipelineDef {
  optional int64 num_threads = 1 [default = 4];
  required int32 batch_size = 2;
  optional int32 device_id = 3 [default = 0];
  optional int64 seed = 4 [default = 1];
  optional bool rocal_cpu = 5 [default = true];
  optional int32 prefetch_queue_depth = 6 [default = 2];
  repeated OperatorDef operators = 7;
  repeated InputOutput pipe_outputs = 8;
}